name: CI

on:
  push:
    branches: [master, 'refonte/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 24]
    env:
      # Reads the private @run-iq packages (org secret: classic PAT, read:packages).
      NODE_AUTH_TOKEN: ${{ secrets.RUN_IQ_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          registry-url: https://npm.pkg.github.com
          scope: '@run-iq'
          cache: npm
      # A pull request into refonte/<name>, or a push to it, is checked against the branch of the
      # same name of the sibling Run-IQ packages (spec core), not against the
      # published ones (the registry has no version matching these ranges). They are built in the
      # runner, left out of this repository's install (the runner's copy of package.json and
      # package-lock.json only) and linked in place. A missing branch fails the run.
      # @run-iq/context-engine has no refonte/phase-2 branch yet, so it stays the published package and
      # its own dependencies on spec and core are replaced by npm overrides (link-refonte.sh,
      # LINK_OVERRIDES). The day it gets that branch it must be linked like the other siblings: this
      # step fails then, so the switch cannot be forgotten.
      - name: Check that context-engine still has no refonte/phase-2 branch
        run: |
          if git ls-remote --exit-code https://github.com/Run-IQ/context-engine.git refs/heads/refonte/phase-2 > /dev/null; then
            echo "::error::Run-IQ/context-engine now has a refonte/phase-2 branch: link it in .github/workflows/ci.yml like spec and core (siblings list), and drop LINK_OVERRIDES."
            exit 1
          fi
      - name: Install against the sibling branches
        if: startsWith(github.base_ref || github.ref_name, 'refonte/')
        env:
          BRANCH: ${{ github.base_ref || github.ref_name }}
          LINK_OVERRIDES: '1'
        run: bash .github/scripts/link-refonte.sh "$BRANCH" spec core
      - name: Install from the published packages
        if: ${{ !startsWith(github.base_ref || github.ref_name, 'refonte/') }}
        run: npm ci
      - name: Typecheck
        id: typecheck
        run: npm run typecheck
      - name: Lint
        id: lint
        run: npm run lint
      - name: Prettier on CLAUDE.md and this workflow
        id: prettier
        run: npm exec --no -- prettier --check CLAUDE.md .github/workflows/ci.yml
      - name: Test (exact baseline, Task 14)
        id: test
        # Fails at the baseline: the exact failures are committed in .github/baseline/test.txt and the step is
        # green only when they are exactly these. A new failure, or a fixed one not removed from the file, fails it.
        # Task 14 makes it fully green and deletes the file.
        run: bash .github/scripts/baseline-check.sh test test
      - name: Build
        id: build
        run: npm run build
